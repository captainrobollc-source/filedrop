<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Drop</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
:root { --bg: #f4f4f1; --card: #fff; --ink: #17181c; --muted: #73757d; --line: #e4e3de; --accent: #4f46e5; --accent-ink: #fff; --bad: #dc2626; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111318; --card: #1a1c22; --ink: #ecedf0; --muted: #8d909a; --line: #2a2d35; --accent: #818cf8; --accent-ink: #0b0c10; --bad: #f87171; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 80px; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; }
h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.muted { color: var(--muted); font-size: 13px; }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.ghost { border-color: transparent !important; background: transparent !important; color: var(--muted) !important; padding: 6px 8px !important; }
.ghost:hover { color: var(--ink) !important; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
textarea, input { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
textarea { resize: vertical; min-height: 46px; }
.compose { padding: 14px; display: grid; gap: 10px; margin-bottom: 14px; }
.compose .row { display: flex; gap: 8px; align-items: flex-start; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; cursor: pointer; color: var(--muted); transition: .15s; }
.drop:hover, .drop.over { border-color: var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.drop b { color: var(--ink); }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 22px 4px 8px; font-weight: 600; }
.list { overflow: hidden; }
.item { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.thumb { width: 48px; height: 48px; border-radius: 10px; flex: none; background: var(--bg); display: grid; place-items: center; overflow: hidden; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.meta { flex: 1; min-width: 0; }
.name { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name a { color: inherit; text-decoration: none; }
.name a:hover { text-decoration: underline; }
.actions { display: flex; gap: 2px; flex: none; }
.note-text { white-space: pre-wrap; word-break: break-word; max-height: 9.5em; overflow: auto; }
.note-text a { color: var(--accent); }
.bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.auth { max-width: 360px; width: calc(100% - 32px); margin: 12vh auto 0; padding: 26px; display: grid; gap: 12px; }
.auth h1 { margin-bottom: 4px; }
.err { color: var(--bad); font-size: 14px; min-height: 1.2em; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; }
#overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--accent) 18%, transparent); border: 3px dashed var(--accent); display: none; place-items: center; font-size: 22px; font-weight: 700; z-index: 5; }
#overlay.show { display: grid; }
dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); padding: 22px; width: min(360px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog form { display: grid; gap: 10px; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="overlay">Drop to send</div>
<div class="toast" id="toast"></div>

<!-- setup / login -->
<div class="card auth" id="authView" hidden>
  <h1><img src="/icon.svg" width="26" height="26" alt=""> Drop</h1>
  <div class="muted" id="authHint"></div>
  <form id="authForm" style="display:grid;gap:10px">
    <input type="password" name="password" autocomplete="current-password" placeholder="Password" required autofocus>
    <input type="password" name="confirm" autocomplete="new-password" placeholder="Type it again" hidden>
    <button class="primary" type="submit" id="authBtn">Sign in</button>
    <div class="err" id="authErr"></div>
  </form>
</div>

<!-- app -->
<div class="wrap" id="appView" hidden>
  <header>
    <h1><img src="/icon.svg" width="26" height="26" alt=""> Drop</h1>
    <div style="display:flex;align-items:center;gap:6px">
      <span class="muted" id="totals"></span>
      <button class="ghost" id="menuBtn" title="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <div class="card compose">
    <div class="row">
      <textarea id="noteText" rows="1" placeholder="Paste text or a link to send it"></textarea>
      <button class="primary" id="sendNote">Send</button>
    </div>
    <label class="drop" id="drop">
      <input type="file" id="picker" multiple hidden>
      <b>Choose files</b> or drop them here<br><span class="muted">You can also paste an image or file anywhere on the page.</span>
    </label>
  </div>

  <div id="uploads"></div>

  <div id="notesWrap" hidden>
    <div class="section-title">Text</div>
    <div class="card list" id="notes"></div>
  </div>

  <div class="section-title">Files</div>
  <div class="card list" id="files"></div>
</div>

<dialog id="menu">
  <form id="pwForm">
    <b>Change password</b>
    <span class="muted">Every other device will have to sign in again.</span>
    <input type="password" name="current" placeholder="Current password" autocomplete="current-password" required>
    <input type="password" name="password" placeholder="New password (6+ characters)" autocomplete="new-password" required minlength="6">
    <div class="err" id="pwErr"></div>
    <div style="display:flex;gap:8px;justify-content:space-between">
      <button type="button" id="logout">Sign out</button>
      <span style="display:flex;gap:8px"><button type="button" onclick="menu.close()">Close</button><button class="primary">Save</button></span>
    </div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let version = 0, pollTimer = null;

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }
function size(b) { if (b < 1024) return b + ' B'; const u = ['KB', 'MB', 'GB']; let i = -1; do { b /= 1024; i++; } while (b >= 1024 && i < 2); return b.toFixed(b < 10 ? 1 : 0) + ' ' + u[i]; }
function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return new Date(t).toLocaleDateString([], { month: 'short', day: 'numeric' });
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', ...(opts.headers || {}) } });
  const body = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.startsWith('/api/login') && !path.startsWith('/api/password')) { start(); throw new Error('signed out'); }
  if (!r.ok) throw new Error(body.error || 'Something went wrong');
  return body;
}

// ---------- auth ----------
async function start() {
  clearInterval(pollTimer);
  const me = await (await fetch('/api/me')).json();
  if (me.signedIn) { $('authView').hidden = true; $('appView').hidden = false; refresh(true); pollTimer = setInterval(refresh, 4000); return; }
  $('appView').hidden = true; $('authView').hidden = false;
  const f = $('authForm');
  f.dataset.mode = me.setup ? 'setup' : 'login';
  f.confirm.hidden = !me.setup; f.confirm.required = me.setup;
  f.password.autocomplete = me.setup ? 'new-password' : 'current-password';
  $('authBtn').textContent = me.setup ? 'Set password' : 'Sign in';
  $('authHint').textContent = me.setup
    ? 'First time here. Pick a password; every device you use will sign in with it once.'
    : 'Sign in to see your files. This device will stay signed in.';
}
$('authForm').onsubmit = async e => {
  e.preventDefault();
  const f = e.target; $('authErr').textContent = '';
  if (f.dataset.mode === 'setup' && f.password.value !== f.confirm.value) { $('authErr').textContent = "The two passwords don't match"; return; }
  try {
    await api(f.dataset.mode === 'setup' ? '/api/setup' : '/api/login', { method: 'POST', body: JSON.stringify({ password: f.password.value }) });
    f.reset(); start();
  } catch (err) { $('authErr').textContent = err.message; }
};
$('menuBtn').onclick = () => $('menu').showModal();
$('logout').onclick = async () => { await api('/api/logout', { method: 'POST' }); $('menu').close(); start(); };
$('pwForm').onsubmit = async e => {
  e.preventDefault(); const f = e.target; $('pwErr').textContent = '';
  try { await api('/api/password', { method: 'POST', body: JSON.stringify({ current: f.current.value, password: f.password.value }) }); f.reset(); $('menu').close(); toast('Password changed'); }
  catch (err) { $('pwErr').textContent = err.message; }
};

// ---------- render ----------
async function refresh(force) {
  let s;
  try { s = await api('/api/state' + (force ? '' : '?v=' + version)); } catch { return; }
  if (s.unchanged) return;
  version = s.version;
  $('totals').textContent = s.files.length ? `${s.files.length} file${s.files.length > 1 ? 's' : ''} · ${size(s.totals.bytes)}` : '';
  $('notesWrap').hidden = !s.notes.length;
  $('notes').innerHTML = s.notes.map(n => `
    <div class="item">
      <div class="meta"><div class="note-text">${linkify(esc(n.text))}</div><div class="muted">${esc(n.from)} · ${ago(n.added)}</div></div>
      <div class="actions">
        <button class="ghost" data-copy="${n.id}" title="Copy"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
        <button class="ghost" data-del-note="${n.id}" title="Delete"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
      </div>
    </div>`).join('');
  $('notes')._data = s.notes;
  $('files').innerHTML = s.files.length ? s.files.map(f => {
    const ext = (f.name.split('.').pop() || '').slice(0, 4);
    const isImg = /^image\/(jpeg|png|gif|webp)/.test(f.type);
    const href = `/f/${f.id}/${encodeURIComponent(f.name)}`;
    return `<div class="item">
      <a class="thumb" href="${href}" target="_blank">${isImg ? `<img loading="lazy" src="${href}" alt="">` : esc(ext)}</a>
      <div class="meta"><div class="name"><a href="${href}" target="_blank">${esc(f.name)}</a></div>
        <div class="muted">${size(f.size)} · ${esc(f.from)} · ${ago(f.added)}</div></div>
      <div class="actions">
        <a class="btn ghost" href="${href}?dl" download="${esc(f.name)}" title="Download"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg></a>
        <button class="ghost" data-del-file="${f.id}" data-name="${esc(f.name)}" title="Delete"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
      </div></div>`;
  }).join('') : '<div class="empty">Nothing here yet. Files you send from any device show up here.</div>';
}
function linkify(html) { return html.replace(/\bhttps?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`); }

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.copy) {
    const n = $('notes')._data.find(x => x.id === b.dataset.copy);
    copy(n.text); toast('Copied');
  } else if (b.dataset.delNote) {
    await api('/api/notes/' + b.dataset.delNote, { method: 'DELETE' }); refresh(true);
  } else if (b.dataset.delFile) {
    if (!confirm(`Delete "${b.dataset.name}" from the phone? This can't be undone.`)) return;
    await api('/api/files/' + b.dataset.delFile, { method: 'DELETE' }); refresh(true);
  }
});
function copy(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
}

// ---------- send text ----------
async function sendNote(text) {
  text = text.trim(); if (!text) return;
  await api('/api/notes', { method: 'POST', body: JSON.stringify({ text }) });
  refresh(true); toast('Sent');
}
$('sendNote').onclick = async () => { const t = $('noteText'); await sendNote(t.value); t.value = ''; };
$('noteText').onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('sendNote').click(); };

// ---------- upload files ----------
function upload(file) {
  const row = document.createElement('div');
  row.className = 'card item'; row.style.marginBottom = '8px';
  row.innerHTML = `<div class="meta"><div class="name">${esc(file.name)}</div><div class="muted"><span>0%</span> of ${size(file.size)}</div><div class="bar"><i></i></div></div>
    <button class="ghost">Cancel</button>`;
  $('uploads').prepend(row);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload?name=' + encodeURIComponent(file.name || 'pasted-' + Date.now()));
  if (file.type) xhr.setRequestHeader('x-file-type', file.type);
  xhr.upload.onprogress = e => {
    if (!e.lengthComputable) return;
    const p = Math.round(100 * e.loaded / e.total);
    row.querySelector('i').style.width = p + '%'; row.querySelector('span').textContent = p + '%';
  };
  xhr.onload = () => {
    if (xhr.status === 200) { row.remove(); refresh(true); toast('Uploaded ' + file.name); }
    else { let m = 'Upload failed'; try { m = JSON.parse(xhr.responseText).error; } catch {} row.querySelector('.muted').innerHTML = `<span style="color:var(--bad)">${esc(m)}</span>`; row.querySelector('button').textContent = 'Dismiss'; }
  };
  xhr.onerror = () => { row.querySelector('.muted').innerHTML = '<span style="color:var(--bad)">Connection lost</span>'; row.querySelector('button').textContent = 'Dismiss'; };
  row.querySelector('button').onclick = () => { xhr.abort(); row.remove(); };
  xhr.send(file);
}
const sendFiles = list => [...list].forEach(upload);
$('picker').onchange = e => { sendFiles(e.target.files); e.target.value = ''; };

let dragDepth = 0;
addEventListener('dragenter', e => { if (e.dataTransfer?.types.includes('Files') && !$('appView').hidden) { dragDepth++; $('overlay').classList.add('show'); } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('overlay').classList.remove('show'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; $('overlay').classList.remove('show');
  if (!$('appView').hidden && e.dataTransfer.files.length) sendFiles(e.dataTransfer.files);
});
addEventListener('paste', e => {
  if ($('appView').hidden) return;
  const fs = [...e.clipboardData.files];
  if (fs.length) { e.preventDefault(); sendFiles(fs); return; }
  if (document.activeElement === $('noteText') || document.activeElement?.tagName === 'INPUT') return;
  const text = e.clipboardData.getData('text'); if (text) { e.preventDefault(); sendNote(text); }
});
start();
</script>
</body>
</html>
